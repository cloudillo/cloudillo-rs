[package]
name = "cloudillo-blob-adapter-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Filesystem-backed content-addressed blob storage adapter for the Cloudillo platform"
keywords = ["cloudillo", "blob", "filesystem", "content-addressed", "adapter"]
categories = ["filesystem", "database-implementations"]
readme = "../../README.md"

[dependencies]
async-stream = "0.3"
async-trait = "0.1.92"
cloudillo-types = { workspace = true }
futures-core = "0.3.34"
tokio = { version = "1.53.1", features = ["fs"] }
tokio-util = { version = "0.7.19", features = ["io"] }

[dev-dependencies]
futures = "0.3"
tempfile = "3.27"
tokio = { version = "1.53.1", features = ["fs", "rt", "macros"] }

[lints]
workspace = true
