[package]
name = "cloudillo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Federated, self-hosted collaboration platform with authentication, file storage, real-time editing, and activity federation"
keywords = ["cloudillo", "federation", "self-hosted", "collaboration", "decentralized"]
categories = ["web-programming", "network-programming"]
readme = "../../README.md"

[dependencies]
cloudillo-types = { workspace = true }
cloudillo-core = { workspace = true }
cloudillo-file = { workspace = true }
cloudillo-push = { workspace = true }
cloudillo-crdt = { workspace = true }
cloudillo-rtdb = { workspace = true }
cloudillo-ref = { workspace = true }
cloudillo-search = { workspace = true }
cloudillo-site = { workspace = true }
cloudillo-email = { workspace = true }
cloudillo-auth = { workspace = true }
cloudillo-proxy = { workspace = true }
cloudillo-idp = { workspace = true }
cloudillo-admin = { workspace = true }
cloudillo-profile = { workspace = true }
cloudillo-action = { workspace = true }
cloudillo-contact = { workspace = true }
cloudillo-calendar = { workspace = true }
cloudillo-dav = { workspace = true }
axum = { version = "0.8.9", features = ["http2", "macros", "multipart", "ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
futures = "0.3.34"
hyper = "1.11.1"
rustls = "0.23.45"
rustls-pki-types = { version = "1.15.1", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "macros", "fs"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "set-header", "trace", "compression-gzip", "compression-zstd"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
cloudillo-auth-adapter-sqlite = { workspace = true }
cloudillo-meta-adapter-sqlite = { workspace = true }
cloudillo-blob-adapter-fs = { workspace = true }
cloudillo-crdt-adapter-redb = { workspace = true }
cloudillo-rtdb-adapter-redb = { workspace = true }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
p384 = { version = "0.14.0", features = ["pkcs8", "pem", "getrandom"] }
tempfile = "3.27"
base64 = "0.23"
tokio-tungstenite = "0.29"
async-trait = "0.1.92"
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "macros", "fs", "sync", "net", "time"] }

[lints]
workspace = true
