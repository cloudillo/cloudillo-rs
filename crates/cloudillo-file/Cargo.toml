[package]
name = "cloudillo-file"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "File storage subsystem for Cloudillo: upload, download, image processing, and variant generation"
keywords = ["cloudillo", "file-storage", "image-processing", "upload", "variants"]
categories = ["web-programming", "filesystem"]
readme = "../../README.md"

[dependencies]
cloudillo-core = { workspace = true }
cloudillo-types = { workspace = true }

# HTTP framework
async-trait = "0.1"
axum = { version = "0.8", features = ["http2", "macros"] }
futures = "0.3"
futures-core = "0.3"
itertools = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "fs", "sync"] }

# Image processing (heavy deps — the whole point of extraction)
image = "0.25"
webp = "0.3"

# SVG processing
resvg = "0.48"
usvg = "0.48"
regex = "1.13"

# CRDT support (for file duplication)
yrs = "0.27"

# LRU cache for the shared directory name cache
lru = "0.18"
parking_lot = "0.12"

# HTML parsing (published-site fragment validation)
lol_html = "2"

# Zip parsing (for app packages)
rawzip = "0.5"

# Decompression (for app package manifest reading)
flate2 = "1"

# Logging
tracing = "0.1"

[lints]
workspace = true
